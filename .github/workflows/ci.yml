name: CI

on:
  push:
    branches: [main, alpha]
  pull_request:
    branches: [main, alpha]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned to the toolchain used locally. Newer stable adds lints that fail
  # clippy -D warnings (float_literal_f32_fallback, chunks_exact_to_as_chunks);
  # bump this together with those fixes.
  RUST_TOOLCHAIN: "1.94.1"

permissions:
  contents: read

jobs:
  windows:
    name: Windows (build, test, clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Upload tinypaw.exe
        uses: actions/upload-artifact@v4
        with:
          name: tinypaw-windows-x64
          path: target/release/tinypaw.exe
          if-no-files-found: error

  linux:
    # Linux is not shipped yet. This job keeps the platform-independent
    # modules (session, registry, features, packs) compiling and their tests
    # passing on Linux ahead of the Niri/Wayland port. Win32-only code is
    # behind `cfg(windows)`, with no-op stand-ins in src/platform/fallback.rs
    # (no Lens, window sources, keyboard hook or focus handoff on Linux).
    # Warnings are not denied here: Windows-only paths leave dead code.
    name: Linux (check, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tray-icon/muda: gtk3, xdo, appindicator. rodio/cpal: ALSA.
      # global-hotkey (x11-dl) and winit/xkbcommon load their libraries at
      # runtime, so they need nothing at build time.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets --locked

      - name: Test
        run: cargo test --locked
