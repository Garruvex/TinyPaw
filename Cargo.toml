[package]
name = "tinypaw"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "canvas", "svg", "crisp", "smol", "advanced"] }
global-hotkey = "0.10.0"
tray-icon = "0.26.1"
interprocess = "2.4.8"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
rfd = { version = "0.18", default-features = false }
serde_json = "1.0"

[features]
# Opt-in GPU renderer for comparisons. tiny-skia measured faster to activate
# and far smaller in memory for the overlay (see docs/measurements.md).
gpu = ["iced/wgpu"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading"] }
