[package]
name = "tinypaw"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "canvas", "svg", "crisp", "smol", "advanced", "image-without-codecs"] }
interprocess = "2.4.8"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# Opt-in GPU renderer for comparisons. tiny-skia measured faster to activate
# and far smaller in memory for the overlay (see docs/measurements.md).
gpu = ["iced/wgpu"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_RemoteDesktop", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }

# Global shortcuts and the tray are native on Windows and macOS. On Wayland a
# compositor binding drives `tinypaw toggle`, and tray-icon would pull in GTK.
[target.'cfg(not(target_os = "linux"))'.dependencies]
global-hotkey = "0.10.0"
tray-icon = "0.26.1"
rfd = { version = "0.18", default-features = false }

# Niri/Wayland: layer-shell overlays through iced_exwlshell. Pin it exactly; each
# release tracks one Iced minor (0.21.x is Iced 0.14). See docs/architecture.md.
[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["wayland"] }
iced_exwlshell = { version = "=0.21.4", default-features = false, features = ["macros"] }
wayland-client = "0.31"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
