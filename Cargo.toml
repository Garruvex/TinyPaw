[package]
name = "tinypaw"
version = "0.1.0"
edition = "2024"

[build-dependencies]
winresource = "0.1"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "canvas", "svg", "crisp", "smol", "advanced", "image-without-codecs"] }
global-hotkey = "0.10.0"
tray-icon = "0.26.1"
interprocess = "2.4.8"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
rfd = { version = "0.18", default-features = false }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# Opt-in GPU renderer for comparisons. tiny-skia measured faster to activate
# and far smaller in memory for the overlay (see docs/measurements.md).
gpu = ["iced/wgpu"]

[dev-dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
iced_tiny_skia = { version = "0.14.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep CPU rasterization responsive in development too. Unoptimized path
# drawing made the long stick/forearm take 38-53 ms per frame at 1440p.
[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.iced_tiny_skia]
opt-level = 3

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_RemoteDesktop", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Magnification", "Win32_System_LibraryLoader"] }

# Local copy of iced_tiny_skia 0.14.1 with damage-tracking fixes: drop
# shadows and stroke widths were left out of repaint bounds, leaving ghosts
# of the quick bar's shadow and of ink and laser edges on transparent
# windows. See vendor/iced_tiny_skia/TINYPAW.md.
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
